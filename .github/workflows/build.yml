# .github/workflows/build.yml

name: Build worse_query

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: xcode-27

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Xcode version
        run: |
          xcodebuild -version

      - name: List project targets and schemes
        run: |
          xcodebuild -list -project worse_query.xcodeproj

      - name: Build application
        run: |
          xcodebuild \
            -project worse_query.xcodeproj \
            -target worse_query \
            -configuration Release \
            -sdk iphoneos \
            -buildRoot "$GITHUB_WORKSPACE/build" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Release-iphoneos/worse_query.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: worse_query.app was not generated."
            find build -name "*.app" -maxdepth 6
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            Payload worse_query.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: worse_query-unsigned-ipa
          path: worse_query.ipa
          if-no-files-found: error
