name: Build worse_query

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: xcode-27

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and select Xcode 27
        shell: bash
        run: |
          set -e

          SELECTED=""

          for APP in /Applications/Xcode*.app; do
            [ -d "$APP/Contents/Developer" ] || continue

            VERSION=$("$APP/Contents/Developer/usr/bin/xcodebuild" -version | head -n 1)
            echo "$APP: $VERSION"

            if [[ "$VERSION" == "Xcode 27"* ]]; then
              SELECTED="$APP/Contents/Developer"
              break
            fi
          done

          if [ -z "$SELECTED" ]; then
            echo "ERROR: Xcode 27 is not installed on this runner."
            exit 1
          fi

          sudo xcode-select -s "$SELECTED"
          xcodebuild -version

      - name: Inspect project
        run: |
          xcodebuild -list -project worse_query.xcodeproj

      - name: Build application
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/build/Release-iphoneos"

          xcodebuild \
            -project worse_query.xcodeproj \
            -target worse_query \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build/Release-iphoneos" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -e

          APP_PATH="$GITHUB_WORKSPACE/build/Release-iphoneos/worse_query.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: worse_query.app was not generated."
            find "$GITHUB_WORKSPACE/build" -name "*.app"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            Payload worse_query.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: worse_query-unsigned-ipa
          path: worse_query.ipa
          if-no-files-found: error
