name: Build worse_query

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build iOS IPA
    runs-on: xcode-27

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 27
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build worse_query
        run: |
          xcodebuild \
            -project worse_query.xcodeproj \
            -target worse_query \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/worse_query.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Build failed: worse_query.app not found"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload worse_query.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: worse_query-unsigned-ipa
          path: worse_query.ipa
          if-no-files-found: error
          retention-days: 14
